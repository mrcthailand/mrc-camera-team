<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ส่งลิงก์ทีมกล้อง</title>
<style>
  :root { --brand:#1D5C63; --ink:#1F2A2E; --muted:#5B6B6F; --line:#DCE5E5; --soft:#EEF5F4; --bg:#F7F9F9;
          --ok-bg:#DCEFE6; --ok:#1F6B45; --warn-bg:#FCE8B2; --warn:#7D5C06; --line-green:#06C755; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif; color:var(--ink); background:var(--bg); font-size:16px; }
  header { background:var(--brand); color:#fff; padding:14px 16px; position:sticky; top:0; z-index:2; }
  header h1 { font-size:19px; margin:0; }
  header p { margin:2px 0 0; font-size:14px; opacity:.85; }
  header a { color:#fff; }
  main { padding:12px; max-width:640px; margin:0 auto; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; }
  .warn { background:#FFF4E5; border-color:#F3D7A6; font-size:14px; color:#7A4A06; }
  .bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:4px 0 10px; }
  .bar .count { font-size:14px; color:var(--muted); margin-right:auto; }
  .chip { font-family:inherit; font-size:14px; padding:6px 12px; border-radius:16px; border:1px solid var(--line); background:#fff; color:var(--ink); cursor:pointer; }
  .chip.on { background:var(--brand); border-color:var(--brand); color:#fff; }
  .p { display:grid; grid-template-columns:1fr auto; gap:6px 10px; align-items:center; padding:12px 0; border-top:1px solid var(--line); }
  .p:first-child { border-top:0; }
  .p.rest { opacity:.55; }
  .name { font-weight:700; font-size:17px; }
  .tag { font-size:12px; color:var(--muted); font-weight:400; margin-left:6px; }
  .meta { font-size:13px; color:var(--muted); }
  .sent { font-size:13px; display:flex; align-items:center; gap:6px; color:var(--muted); justify-self:end; }
  .sent input { width:20px; height:20px; }
  .btns { grid-column:1 / -1; display:flex; gap:8px; }
  button { font-family:inherit; font-size:15px; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:#fff; color:var(--brand); cursor:pointer; }
  .btns button { flex:1; }
  .btn-line { background:var(--line-green); border-color:var(--line-green); color:#fff; font-weight:600; }
  .status { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; font-weight:600; }
  .s-ok { background:var(--ok-bg); color:var(--ok); } .s-warn { background:var(--warn-bg); color:var(--warn); }
  details summary { cursor:pointer; font-weight:600; }
  textarea { width:100%; min-height:150px; font-family:inherit; font-size:15px; padding:10px; border:1px solid var(--line); border-radius:8px; margin-top:8px; }
  .muted { color:var(--muted); font-size:13px; }
  .hint { color:var(--muted); font-size:15px; text-align:center; padding:28px 8px; }
  #toast { position:fixed; left:12px; right:12px; bottom:16px; background:#12363A; color:#fff; padding:14px; border-radius:10px; display:none; text-align:center; z-index:5; }
</style>
</head>
<body>
<header><h1>ส่งลิงก์ส่วนตัวให้ทีม</h1><p id="sub">กำลังโหลด…</p></header>
<main id="main"><p class="hint">กำลังโหลด…</p></main>
<div id="toast"></div>
<script>
const API = 'https://script.google.com/macros/s/AKfycbyrtjxK_J51RclVybAoismuXS-NWdJXmR0jrAifHXB3IGbHnnTqAofTA0HQgZStECcICw/exec';
const TOKEN = (new URLSearchParams(location.search).get('k') || '').replace(/[^A-Za-z0-9]/g, '');
const $ = id => document.getElementById(id);
const DEFAULT_TPL = 'สวัสดีครับ {ชื่อ} 🙏\n' +
  'นี่คือลิงก์ลงชื่อเวรทีมกล้องของ {ชื่อ} โดยเฉพาะ รอบ {รอบ}\n' +
  'กดแล้วเลือกวันและตำแหน่งที่สะดวกได้เลย (ไม่เกิน {โควตา} สัปดาห์)\n\n' +
  '{ลิงก์}\n\n' +
  'ลิงก์นี้ใช้ได้เฉพาะ {ชื่อ} คนเดียว ไม่ต้องส่งต่อนะครับ เก็บไว้ใช้ได้ตลอด ถ้าติดธุระก็กดยกเลิกจากลิงก์นี้ได้เลย';
let D = null, FILTER = 'notsent';

function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
function sentMap() { try { return JSON.parse(store('mrc-sent') || '{}'); } catch (e) { return {}; } }
function setSent(name, on) { const m = sentMap(); if (on) m[name] = 1; else delete m[name]; store('mrc-sent', JSON.stringify(m)); }
function tpl() { return store('mrc-tpl') || DEFAULT_TPL; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' })[c]); }
function toast(m) { const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 2500); }

function message(p) {
  const w = D.weeks;
  return tpl().split('{ชื่อ}').join(p.name).split('{ลิงก์}').join(p.link)
    .split('{รอบ}').join(w[0].date + ' – ' + w[w.length - 1].date).split('{โควตา}').join(D.maxPerPerson);
}

function copyText(t, msg) {
  const done = () => toast(msg || 'คัดลอกแล้ว');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, () => fallback(t, done));
  else fallback(t, done);
}
function fallback(t, done) {
  const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select();
  try { document.execCommand('copy'); done(); } catch (e) { prompt('คัดลอกข้อความนี้', t); }
  a.remove();
}

function load() {
  if (window.MOCK) return render(window.MOCK);
  fetch(API + '?' + new URLSearchParams({ api: '1', action: 'dashboard', k: TOKEN }), { credentials: 'omit', cache: 'no-store' })
    .then(r => r.json())
    .then(d => d.ok ? render(d) : ($('main').innerHTML = '<p class="hint">' + esc(d.msg || 'เปิดไม่ได้') + '</p>', $('sub').textContent = ''))
    .catch(() => { $('main').innerHTML = '<p class="hint">โหลดไม่สำเร็จ ลองรีเฟรชอีกครั้ง</p>'; });
}

function render(d) {
  D = d;
  const w = d.weeks;
  $('sub').innerHTML = 'รอบ ' + esc(w[0].date) + ' – ' + esc(w[w.length - 1].date) + ' · <a href="dashboard.html?k=' + TOKEN + '">← แดชบอร์ด</a>';
  const sent = sentMap();
  const people = d.people.filter(p => p.link)
    .sort((a, b) => (b.active - a.active) || a.name.localeCompare(b.name, 'th'));
  const active = people.filter(p => p.active);
  const nSent = active.filter(p => sent[p.name]).length;
  const shown = people.filter(p => FILTER === 'all' || (FILTER === 'notsent' ? p.active && !sent[p.name] : p.active && p.count === 0));

  let h = '<div class="card warn">ส่งทาง <b>แชตส่วนตัว</b> ทีละคนเท่านั้น อย่าโพสต์ในกลุ่ม เพราะใครได้ลิงก์ไปจะลงชื่อแทนเจ้าของลิงก์ได้</div>';
  h += '<div class="bar"><span class="count">ส่งแล้ว ' + nSent + ' / ' + active.length + ' คน</span>' +
    chip('notsent', 'ยังไม่ส่ง') + chip('nosign', 'ยังไม่ลงชื่อ') + chip('all', 'ทั้งหมด') + '</div>';
  h += '<div class="card" id="list">';
  if (!shown.length) h += '<p class="muted" style="text-align:center;padding:12px">' + (FILTER === 'notsent' ? 'ส่งครบทุกคนแล้ว 🎉' : 'ไม่มีรายชื่อในกลุ่มนี้') + '</p>';
  shown.forEach(p => {
    const i = people.indexOf(p);
    const st = !p.active ? '<span class="muted">พัก</span>' : p.count ? '<span class="status s-ok">ลงแล้ว ' + p.count + ' สัปดาห์</span>' : '<span class="status s-warn">ยังไม่ลงชื่อ</span>';
    h += '<div class="p' + (p.active ? '' : ' rest') + '">' +
      '<div><div class="name">' + esc(p.name) + (p.canSwitch ? '<span class="tag">SW</span>' : '') + '</div><div class="meta">' + st + '</div></div>' +
      '<label class="sent"><input type="checkbox" data-i="' + i + '"' + (sent[p.name] ? ' checked' : '') + '> ส่งแล้ว</label>' +
      '<div class="btns"><button class="btn-line" data-a="line" data-i="' + i + '">ส่งทาง LINE</button>' +
      '<button data-a="msg" data-i="' + i + '">คัดลอก</button>' +
      '<button data-a="link" data-i="' + i + '">เฉพาะลิงก์</button></div></div>';
  });
  h += '</div>';
  h += '<div class="card"><details><summary>แก้ข้อความที่ส่ง</summary>' +
    '<p class="muted">ใช้ {ชื่อ} {ลิงก์} {รอบ} {โควตา} แทนข้อมูลของแต่ละคน · บันทึกไว้ในเครื่องนี้</p>' +
    '<textarea id="tpl">' + esc(tpl()) + '</textarea>' +
    '<div class="bar"><button id="saveTpl">บันทึกข้อความ</button><button id="resetTpl">กลับเป็นค่าเริ่มต้น</button></div></details></div>';
  h += '<p class="muted">ถ้าลิงก์ของใครหลุดไปถึงคนอื่น: ลบรหัสของคนนั้นในชีต แท็บรายชื่อ คอลัมน์ H แล้วรัน generateLinks ใหม่ ลิงก์เก่าจะใช้ไม่ได้ทันที</p>';
  $('main').innerHTML = h;

  document.querySelectorAll('.chip').forEach(c => c.onclick = () => { FILTER = c.dataset.f; render(D); });
  document.querySelectorAll('.sent input').forEach(c => c.onchange = () => { setSent(people[c.dataset.i].name, c.checked); render(D); });
  document.querySelectorAll('.btns button').forEach(b => b.onclick = () => {
    const p = people[b.dataset.i];
    if (b.dataset.a === 'line') {
      setSent(p.name, true);
      location.href = 'https://line.me/R/share?text=' + encodeURIComponent(message(p));
    } else if (b.dataset.a === 'msg') {
      copyText(message(p), 'คัดลอกข้อความของ ' + p.name + ' แล้ว ไปวางในแชตส่วนตัวได้เลย');
      setSent(p.name, true); setTimeout(() => render(D), 50);
    } else copyText(p.link, 'คัดลอกลิงก์ของ ' + p.name + ' แล้ว');
  });
  $('saveTpl').onclick = () => {
    const v = $('tpl').value;
    if (v.indexOf('{ลิงก์}') === -1) return toast('ข้อความต้องมี {ลิงก์} ด้วย');
    store('mrc-tpl', v); toast('บันทึกข้อความแล้ว');
  };
  $('resetTpl').onclick = () => { store('mrc-tpl', DEFAULT_TPL); render(D); toast('กลับเป็นข้อความเริ่มต้นแล้ว'); };
}
function chip(f, label) { return '<button class="chip' + (FILTER === f ? ' on' : '') + '" data-f="' + f + '">' + label + '</button>'; }
load();
</script>
</body>
</html>
